name: cp-demo

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ELEVENLABS_VERIFY_SSL: ${ELEVENLABS_VERIFY_SSL:-true}
      VECTOR_STORE_API_TOKEN: ${VECTOR_STORE_API_TOKEN:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Cambiami24!}
      PUBLIC_BASE_URL: ${APP_URL:-http://localhost:8080}
      POST_CALL_WEBHOOK_SECRET: ${POST_CALL_WEBHOOK_SECRET:-}
    volumes:
      - ./server-data:/app/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  gateway:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.public_gateway:public_app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    environment:
      INTERNAL_API_URL: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8002"

  mediawiki-sync:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.mediawiki_sync", "--loop"]
    environment:
      MEDIAWIKI_BASE_URL: ${MEDIAWIKI_BASE_URL:-https://wikiweb.centropaghe.it}
      MEDIAWIKI_ROOT_PAGE: ${MEDIAWIKI_ROOT_PAGE:-Help_On_Line}
      MEDIAWIKI_USERNAME: ${MEDIAWIKI_USERNAME:-}
      MEDIAWIKI_PASSWORD: ${MEDIAWIKI_PASSWORD:-}
      MEDIAWIKI_TENANT: ${MEDIAWIKI_TENANT:-principale}
      MEDIAWIKI_AREA: ${MEDIAWIKI_AREA:-Paghe Web}
      MEDIAWIKI_SYNC_INTERVAL_MINUTES: ${MEDIAWIKI_SYNC_INTERVAL_MINUTES:-15}
      MEDIAWIKI_FULL_SYNC_HOURS: ${MEDIAWIKI_FULL_SYNC_HOURS:-24}
      MEDIAWIKI_VERIFY_SSL: ${MEDIAWIKI_VERIFY_SSL:-true}
    volumes:
      - ./server-data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      IFRAME_ANCESTORS: ${IFRAME_ANCESTORS:-'self'}
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_started
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_started
